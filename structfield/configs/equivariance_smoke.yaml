schema_version: "1.0"
experiment_id: "equivariance-smoke-v0.3"
definition_status: "frozen-a-priori"
contains_results: false
estimator_config: "analytic_default.yaml"
transform_dataclass: "structfield.transforms.GeometricTransform"
tensor_transform_function: "structfield.transforms.transform_tensor"
field_transform_function: "structfield.transforms.transform_structural_field"
coordinate_convention: "x-right-y-down-positive-displayed-counter-clockwise"
sampling: "bilinear-align-corners-false"
valid_mask_policy: "intersection-of-observed-and-expected-strict-valid-masks"
transforms:
  - name: "identity"
    parameters: {"rotation_rad": 0.0, "scale": 1.0}
  - name: "rotate-minus-15deg"
    parameters: {"rotation_rad": -0.2617993877991494, "scale": 1.0}
  - name: "rotate-plus-15deg"
    parameters: {"rotation_rad": 0.2617993877991494, "scale": 1.0}
  - name: "scale-down"
    parameters: {"rotation_rad": 0.0, "scale": 0.8}
  - name: "scale-up"
    parameters: {"rotation_rad": 0.0, "scale": 1.25}
losses:
  - signal: "orientation_prob"
    python_class: "structfield.losses.OrientationEquivarianceLoss"
  - signal: "frequency_mean"
    python_class: "structfield.losses.FrequencyEquivarianceLoss"
  - signal: "structural_uncertainty"
    python_class: "structfield.losses.UncertaintyEquivarianceLoss"
smoke_contract:
  require_nonempty_valid_mask: true
  compare_aligned_branches: true
  detach_either_branch: false
  claim_exact_group_equivariance: false
